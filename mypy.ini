[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# Skyfield ships no py.typed marker and no stub package, so mypy can't
# see inside it -- without this, every `from skyfield... import ...`
# line raises an unavoidable "missing library stubs" error that has
# nothing to do with our own code. This tells mypy to trust that
# skyfield's classes (EarthSatellite, Time, Timescale, GeographicPosition,
# ...) exist and use them as the precise types they are in our own
# function signatures, while treating calls *into* skyfield's own
# methods as returning Any (since it has no way to check those).
# matplotlib and numpy both ship py.typed and don't need this.
[mypy-skyfield.*]
ignore_missing_imports = True
