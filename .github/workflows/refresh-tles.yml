name: Refresh TLE mirror

# Fetches TLEs from Celestrak and republishes them on the `tle-data` branch, which the
# deployed app reads because Streamlit Cloud cannot reach celestrak.org (see docs/DECISIONS.md).
on:
  schedule:
    # Every 6 hours at :17; GitHub advises avoiding :00, when scheduled-workflow load peaks.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # Pinned so a runner image change can't break the pipeline unannounced.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main (fetch script + package config)
        uses: actions/checkout@v7

      - name: Checkout existing tle-data branch, if it exists
        uses: actions/checkout@v7
        # Fails on the first run, before tle-data exists; continue with an empty tle/.
        continue-on-error: true
        with:
          ref: tle-data
          path: _tle_data_branch

      - name: Seed tle/ from the existing tle-data branch, if any
        run: |
          mkdir -p tle
          if [ -d "_tle_data_branch/tle" ]; then
            cp -r _tle_data_branch/tle/. tle/
            echo "Seeded tle/ from the existing tle-data branch."
          else
            echo "No existing tle-data branch found (first run) -- starting with an empty tle/ directory."
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # Core dependencies only (everything fetch_tles needs), pinned to the lock file.
        run: pip install -c requirements.txt .

      - name: Fetch TLEs from Celestrak
        id: fetch
        run: |
          set +e
          satpass-fetch-tles --output-dir tle
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        # The exit code is captured so whatever succeeded is published before the job fails.

      - name: Publish tle/ to the tle-data branch (single orphan commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # A fresh orphan commit keeps tle-data at a single commit; the force-push is required
          # because it shares no history with the existing branch.
          rm -rf _publish
          mkdir _publish
          cp -r tle _publish/tle
          cd _publish
          git init -q
          git checkout -q --orphan tle-data
          git add tle
          git commit -q -m "Refresh TLE mirror ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin tle-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail the job if any satellite fetch failed
        if: steps.fetch.outputs.exit_code != '0'
        run: |
          echo "One or more satellites failed to fetch this run -- see the 'Fetch TLEs from Celestrak' step above for details."
          echo "Whatever succeeded (and whatever was preserved from the previous run for the satellite(s) that failed) was still published above."
          exit 1
