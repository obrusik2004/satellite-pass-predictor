name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    # Generous for a cold install; the tests themselves take well under a minute.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported floor; 3.14 is what Streamlit Community Cloud runs.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install
        # The dev extra includes the app extra; requirements.txt pins the deployed versions.
        run: pip install -e ".[dev]" -c requirements.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy app.py main.py satellite_pass_predictor tests

      - name: pytest
        run: pytest --cov=satellite_pass_predictor --cov-report=term-missing
