[client]
# Hides the developer toolbar (deploy button and rerun/clear-cache menu items).
toolbarMode = "minimal"
# Visitors see a generic message for uncaught errors instead of a traceback; details stay in server logs.
showErrorDetails = "none"

# Dark navy theme. The same colors are duplicated in
# satellite_pass_predictor/config.py for renderers Streamlit's theme can't reach (pydeck,
# matplotlib, the HTML report); keep the two in sync by hand.
[theme]
base = "dark"
backgroundColor = "#0B1D26"
secondaryBackgroundColor = "#003247"
textColor = "#EAF2F5"
borderColor = "#335E6F"
# Muted accent, deliberately distinct from every satellite color so a focused widget can't
# be read as a satellite in the legend.
primaryColor = "#5B8BA0"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Oswald:https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#003247"
secondaryBackgroundColor = "#0B1D26"
textColor = "#EAF2F5"
borderColor = "#335E6F"
primaryColor = "#5B8BA0"
