[pytest]
# Without this, bare `pytest` fails to import satellite_pass_predictor:
# pytest only auto-adds a directory to sys.path when it contains an
# __init__.py (rootdir-insertion via "rootdir" package detection), and
# tests/ deliberately has none (these are standalone test modules, not
# a test package) -- so without `pythonpath`, pytest inserts tests/
# itself into sys.path, not the repo root, and `import
# satellite_pass_predictor` fails. `python -m pytest` happens to work
# without this because `-m` itself adds the current directory (the repo
# root) to sys.path -- a difference in how Python starts up, not in how
# pytest resolves imports. Setting this explicitly makes collection work
# the same way regardless of how pytest is invoked.
#
# This project has no pyproject.toml (it's a plain venv + requirements.txt
# script project, not a packaged/installable one -- see mypy.ini for the
# same reasoning applied to mypy's config), so a single-purpose pytest.ini
# fits better than introducing packaging metadata just to hold this.
pythonpath = .
testpaths = tests
