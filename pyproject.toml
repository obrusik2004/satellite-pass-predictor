[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-pass-predictor"
version = "0.9.0"
description = "SGP4 satellite pass predictor for Kourou, French Guiana (the Guiana Space Centre)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aleksander Bruski" }]
# Core: everything the CLI and the TLE fetch script need. sgp4 is listed explicitly because
# the propagator is a deliberate choice (docs/DECISIONS.md), not just a skyfield detail.
dependencies = [
    "skyfield>=1.55,<2",
    "sgp4>=2.27,<3",
    "requests>=2.34,<3",
    "matplotlib>=3.11,<4",
    "numpy>=2.4,<3",
    "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
# Needed only by app.py and the modules it alone uses (globe.py, skyplot.py).
app = [
    "streamlit>=1.64,<2",
    "pydeck>=0.9,<1",
    "plotly>=7.1,<8",
    "pandas>=3.0,<4",
]
# Includes "app": the tests exercise globe.py and skyplot.py, and mypy checks app.py.
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "mypy>=2.3,<3",
    "ruff>=0.16,<1",
    "satellite-pass-predictor[app]",
]

[project.urls]
Homepage = "https://github.com/obrusik2004/satellite-pass-predictor"

[project.scripts]
satpass = "satellite_pass_predictor.cli:main"
satpass-fetch-tles = "satellite_pass_predictor.fetch_tles:main"

[tool.setuptools.packages.find]
include = ["satellite_pass_predictor*"]

[tool.setuptools.package-data]
satellite_pass_predictor = ["assets/*.geojson"]

[tool.ruff]
line-length = 100
extend-exclude = ["venv", "data", "output"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and flake8-simplify. Kept narrow on purpose.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# These libraries ship no py.typed marker.
module = ["skyfield.*", "pydeck.*", "plotly.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
